name: Build Schedule Reminder Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ScheduleReminder_Android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Set NDK environment
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Android Rust build tooling
        run: cargo install cargo-ndk --locked
      - name: Compile Rust and generate UniFFI Kotlin
        run: bash ScheduleReminder_Android/scripts/build-rust-android.sh
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      # Optional: supply ANDROID_DEBUG_KEYSTORE_B64 as a repository secret to keep
      # the SAME debug signing identity across all subsequent CI builds.
      - name: Restore stable signing key (optional)
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE" | base64 -d > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo 'Restored stable debug signing keystore.'
          else
            echo 'Warning: no persistent signing key; installs may not upgrade previous APKs.'
          fi
      - name: Assemble installable APK
        working-directory: ScheduleReminder_Android/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp ScheduleReminder_Android/android/app/build/outputs/apk/debug/app-debug.apk ScheduleReminder-Android-v1.1.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScheduleReminder-Android-v1.1-APK
          path: ScheduleReminder-Android-v1.1.apk
          if-no-files-found: error